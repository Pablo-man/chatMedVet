name: Docker-AWS Setup & Update & Run new images

on:
  workflow_call:
    secrets:
      docker_username:
        required: true
      ec2_host:
        required: true
      ec2_key:
        required: true
      repository_name:
        required: true
      qdrant_api_key:
        required: true
      qdrant_url:
        required: true
      openai_api_key:
        required: true

jobs:
  connect_update:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH into EC2 and Deploy Application
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.ec2_host }}
        username: ubuntu
        key: ${{ secrets.ec2_key }}
        script: |
          if ! command -v docker &> /dev/null; then
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            sudo systemctl restart docker
          else
            echo "Docker ya está instalado."
          fi
          
          sudo docker pull ${{ secrets.docker_username }}/${{ secrets.repository_name }}:latest

          # Detener y eliminar contenedor existente (si existe)
          echo "Deteniendo contenedor existente..."
          sudo docker stop medvetChat || true
          sudo docker rm medvetChat || true
            
          # Limpiar imágenes antiguas para ahorrar espacio
          echo "Limpiando imágenes antiguas..."
          sudo docker image prune -f
            
          # Ejecutar nuevo contenedor
          echo "Iniciando nuevo contenedor..."
          sudo docker run -d --name medvetChat -p 8000:8000 --restart unless-stopped -e QDRANT_URL=${{ secrets.qdrant_url }} -e QDRANT_API_KEY=${{ secrets.qdrant_api_key }} -e OPENAI_API_KEY=${{ secrets.openai_api_key }} ${{ secrets.docker_username }}/${{ secrets.repository_name }}:latest
